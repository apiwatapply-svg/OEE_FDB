[agent]
  # ตั้งค่าพื้นฐาน
  interval = "2s"
  round_interval = true
  metric_batch_size = 1000       
  metric_buffer_limit = 100000
  collection_jitter = "0s"
  flush_interval = "2s"
  flush_jitter = "1s"
  precision = "0s"
  omit_hostname = true
  
  # Path ของ State file (ตั้งให้เป็นของ ABR)
  statefile = "D:/ABR_Data/telegraf-1.33.0/telegraf.state"

# ==========================================
# --- ส่งข้อมูลไปยัง InfluxDB Server ---
# ==========================================
[[outputs.influxdb]]
  urls = ["http://192.168.100.99:5012"]
  database = "machine_db"
  timeout = "10s" 

# ==========================================
# --- ส่งข้อมูลไปยัง MQTT Broker (แยกตามประเภท) ---
# ==========================================
[[outputs.mqtt]]
  namepass = ["data_tb"]
  servers = ["tcp://192.168.100.99:1883"]
  topic = "factory/{{ .Tag \"machine_type\" }}/{{ .Tag \"machine_name\" }}/data"
  data_format = "json"
  qos = 2

[[outputs.mqtt]]
  namepass = ["status_tb"]
  servers = ["tcp://192.168.100.99:1883"]
  topic = "factory/{{ .Tag \"machine_type\" }}/{{ .Tag \"machine_name\" }}/status"
  data_format = "json"
  qos = 2

[[outputs.mqtt]]
  namepass = ["alarm_tb"]
  servers = ["tcp://192.168.100.99:1883"]
  topic = "factory/{{ .Tag \"machine_type\" }}/{{ .Tag \"machine_name\" }}/alarm"
  data_format = "json"
  qos = 2

# ==========================================
# --- 1. การอ่านไฟล์ข้อมูล output (data) ---
# ==========================================
[[inputs.tail]]
  files = ["D:/ABR_Data/*/output/20*.dat"]
  path_tag = "path"
  from_beginning = false
  watch_method = "poll"
  name_override = "data_tb"
  
  data_format = "csv"
  csv_delimiter = ";"
  csv_header_row_count = 0
  
  # คอลัมน์ที่ได้จาก main.py (10 คอลัมน์):
  csv_column_names = [
    "DateTime_UTC", "DateTime_Local", "Model", "Total", "OK", "NG", 
    "sta_val", "stb_val", "cycle_time", "id"
  ]
  csv_tag_columns = ["Model"]
  # ให้ cycle_time เป็น string ไปก่อนเพื่อกัน error ตอนได้ค่า "-" แล้วค่อยแปลงใน Starlark
  csv_column_types = [
    "string", "string", "string", "int", "int", "int", 
    "string", "string", "string", "int"
  ]
  csv_skip_errors = true

  [inputs.tail.tags]
    machine_type = "ABR"

# ==========================================
# --- 2. การอ่านไฟล์ข้อมูล status ---
# ==========================================
[[inputs.tail]]
  files = ["D:/ABR_Data/*/machine_status/20*.dat"]
  path_tag = "path"
  from_beginning = false
  watch_method = "poll"
  name_override = "status_tb"
  
  data_format = "csv"
  csv_delimiter = ";"
  csv_header_row_count = 0
  
  # คอลัมน์ (3 คอลัมน์)
  csv_column_names = [
    "DateTime_UTC", "DateTime_Local", "Status"
  ]
  
  csv_column_types = [
    "string", "string", "string"
  ]
  csv_skip_errors = true

  [inputs.tail.tags]
    machine_type = "ABR"

# ==========================================
# --- 3. การอ่านไฟล์ข้อมูล alarm ---
# ==========================================
[[inputs.tail]]
  files = ["D:/ABR_Data/*/machine_alarm/20*.dat"]
  path_tag = "path"
  from_beginning = true
  watch_method = "poll"
  name_override = "alarm_tb"
  
  data_format = "csv"
  csv_delimiter = ";"
  csv_header_row_count = 0
  
  # คอลัมน์ (4 คอลัมน์)
  csv_column_names = [
    "DateTime_UTC", "DateTime_Local", "Alarm", "Device"
  ]
  
  csv_column_types = [
    "string", "string", "string", "string"
  ]
  csv_skip_errors = true

  [inputs.tail.tags]
    machine_type = "ABR"

# ==========================================
# --- ส่วนการแกะชื่อ Folder มาเป็น Tag machine_name ---
# ==========================================
[[processors.regex]]
  namepass = ["data_tb", "status_tb", "alarm_tb"]

  [[processors.regex.tags]]
    key = "path"
    pattern = '^.*ABR_Data[/\\](?P<machine_name>[^/\\]+)[/\\].*$'
    replacement = "${machine_name}"
    result_key = "machine_name"

# ==========================================
# --- ส่วนการจัดการ Field และ Timestamp (Starlark) ---
# ==========================================
[[processors.starlark]]
  namepass = ["data_tb", "status_tb", "alarm_tb"]
  source = '''
load("time.star", "time")

def apply(metric):
    # ลบ path ทิ้ง
    metric.tags.pop("path", None)

    # 1. จัดการ Date Time
    dt_str = metric.fields.pop("DateTime_UTC", None)
    
    if type(dt_str) == "string" and dt_str.strip() != "":
        format_str = "2006-01-02 15:04:05"
        if "." in dt_str:
            format_str = "2006-01-02 15:04:05.999"
            
        parsed_time = time.parse_time(dt_str, format_str, "UTC")
        cutoff_time = time.now() - time.parse_duration("120h")
        if parsed_time < cutoff_time:
            return None 
            
        metric.time = parsed_time.unix_nano
        
        # คืนค่า Date_Time_UTC คงมิลลิวินาทีไว้ตามที่สั่ง
        metric.fields["Date_Time_UTC"] = dt_str
        
        # คำนวณ shift จากชั่วโมง UTC M(00-11:59) N(12-23:59)
        hr = parsed_time.hour
        if hr >= 0 and hr < 12:
            metric.fields["shift"] = "M"
        else:
            metric.fields["shift"] = "N"
    else:
        return None

    # สกัด date_local และ time_local คืนมิลลิวินาทีไว้
    dt_local = metric.fields.pop("DateTime_Local", None)
    if type(dt_local) == "string" and " " in dt_local:
        parts = dt_local.split(" ")
        if len(parts) >= 2:
            metric.fields["date_local"] = parts[0]
            metric.fields["time_local"] = parts[1]
            
    # เฉพาะข้อมูลของ data_tb
    if metric.name == "data_tb":
        # 2. แปลง cycle_time
        ct_val = metric.fields.get("cycle_time")
        if type(ct_val) == "string":
            if ct_val == "-":
                # Keep cycle_time = 0.0 so COUNT(cycle_time) still counts this record.
                # ABR produces multiple parts per stroke — only the first has real CT.
                # influxService filters cycle_time > 0 when computing MEAN.
                metric.fields["cycle_time"] = 0.0
                metric.fields["time_interval"] = 0.0
            else:
                f_val = float(ct_val)
                metric.fields["cycle_time"] = f_val
                metric.fields["time_interval"] = f_val
                
        # 3. judg_result & ng_indicator
        sta = metric.fields.pop("sta_val", "")
        stb = metric.fields.pop("stb_val", "")
        if type(sta) != "string": sta = ""
        if type(stb) != "string": stb = ""
        combined = sta + "," + stb + ",,,"
        metric.fields["judg_result"] = combined
        metric.fields["ng_indicator"] = combined
        
        # 4. emp_no เป็นชื่อเครื่อง
        # ต้องใช้ get("machine_name") แล้วครอบด้วย str() กันตกหล่น
        m_name = metric.tags.get("machine_name")
        if m_name == None: m_name = "Unknown"
        metric.fields["emp_no"] = str(m_name)
        
        # 5. lot_no = ""
        metric.fields["lot_no"] = ""
        
        # 6. lot_size = Total
        tot = metric.fields.get("Total")
        if tot != None:
            metric.fields["lot_size"] = tot
            
        # 7. Drop_Empty_Column
        metric.fields["Drop_Empty_Column"] = ""

    return metric
'''